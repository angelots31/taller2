{% extends "catalogo/base.html" %}

{% block title %}Nuevo producto — TiendaOnline{% endblock %}
{% block nav_productos %}active{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Nuevo producto</h1>
</div>

<form method="POST" class="form-card">
    {% csrf_token %}
    <div class="form-grid">
        <div class="field field-full">
            <label for="nombre">Nombre del producto <span class="required">*</span></label>
            <input type="text" id="nombre" name="nombre" value="{{ datos.nombre|default:'' }}" placeholder="Ej: Laptop Gaming Pro" required autofocus>
        </div>
        <div class="field">
            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" name="categoria" value="{{ datos.categoria|default:'' }}" placeholder="Ej: Electrónica, Accesorios...">
        </div>
        <div class="field">
            <label for="precio">Precio <span class="required">*</span></label>
            <div class="input-prefix">
                <span class="prefix">$</span>
                <input type="number" id="precio" name="precio" step="0.01" min="0.01" value="{{ datos.precio|default:'' }}" placeholder="0.00" required>
            </div>
        </div>
        <div class="field">
            <label for="stock">Stock <span class="required">*</span></label>
            <input type="number" id="stock" name="stock" min="0" value="{{ datos.stock|default:'' }}" placeholder="0" required>
        </div>
        <div class="field">
            <label for="imagen_url">URL de imagen</label>
            <input type="url" id="imagen_url" name="imagen_url" value="{{ datos.imagen_url|default:'' }}" placeholder="https://...">
        </div>
        <div class="field field-full">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3" placeholder="Describe las características del producto...">{{ datos.descripcion|default:'' }}</textarea>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Crear producto</button>
        <a href="{% url 'index' %}" class="btn btn-ghost">Cancelar</a>
    </div>
</form>
{% endblock %}
