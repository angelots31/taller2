<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 600px;">
        <h2 class="mb-4">Realizar Nuevo Pedido</h2>
        <form method="POST" class="card p-4 shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Correo del Cliente</label>
                <input type="email" name="cliente_email" class="form-control" placeholder="cliente@correo.com" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Seleccionar Producto</label>
                <select name="producto_id" class="form-select" required>
                    <option value="" disabled selected>-- Seleccione un producto --</option>
                    {% for p in productos %}
                        <option value="{{ p.id }}">{{ p.nombre }} - ${{ p.precio }} (Stock: {{ p.stock }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Cantidad</label>
                <input type="number" name="cantidad" class="form-control" min="1" value="1" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Registrar Pedido</button>
                <a href="{% url 'listar_pedidos' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
