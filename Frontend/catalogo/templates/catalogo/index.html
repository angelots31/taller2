<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechGear - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark ">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 text-primary">Catálogo TechGear</h1>
            <a href="{% url 'listar_pedidos' %}" class="btn btn-success">Ver Pedidos</a>
            <a href="{% url 'crear_producto' %}" class="btn btn-success">Nuevo Producto</a>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for p in productos %}
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ p.nombre }}</h5>
                        <p class="card-text text-muted">{{ p.descripcion }}</p>
                        <p class="h5 text-success my-3">${{ p.precio }}</p>
                        <span class="badge bg-secondary">Stock: {{ p.stock }}</span>
                    </div>
                    <div class="card-footer bg-transparent border-top-0 d-flex gap-2">
                        <a href="{% url 'editar_producto' p.id %}" class="btn btn-warning btn-sm w-50">Editar</a>
                        <a href="{% url 'eliminar_producto' p.id %}" class="btn btn-danger btn-sm w-50" onclick="return confirm('¿Eliminar este producto?')">Eliminar</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center py-5">
                <p class="text-muted">No se encontraron productos en el catálogo.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
